# Automation settings
settings:
  # Excel automation
  excel_wait_timeout: 300  # Maximum seconds to wait for Excel refresh (5 minutes)
  excel_visible: true      # Show Excel window during automation (useful for debugging)

  # Screenshot settings
  screenshot_dpi: 96       # Resolution for screenshots
  screenshot_format: "jpg"

  # Script execution
  script_check_interval: 5    # Seconds between output checks when monitoring run.py
  script_max_wait: 1800       # Maximum seconds to wait for run.py completion (30 minutes)

